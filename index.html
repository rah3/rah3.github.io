<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahie Datta | Portfolio</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="header-root"></div>
    <nav id="main-nav" class="main-nav">
        <div class="nav-inner">
            <button data-target="objective">Objective</button>
            <button data-target="education">Education</button>
            <button data-target="skills">Technical Skills</button>
            <button data-target="experience">Experience</button>
            <button data-target="projects">Projects</button>
            <button data-target="awards">Honors & Awards</button>

        <section id="resume-root"></section>
        <section id="contact-root"></section>
    </main>
    <div id="footer-root"></div>

    <script type="module">
        import { renderHeader } from './header.js';
        import { renderFooter } from './footer.js';
        import { renderHome } from './home.js';
        import { renderResume } from './resume.js';
        import { renderContact } from './contact.js';
        import { initScrollOperations } from './scrollOperations.js';

        renderHeader('header-root');
        renderHome('home-root');
        renderResume('resume-root');

        renderFooter('footer-root');
        initScrollOperations();
