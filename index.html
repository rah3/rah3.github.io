<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahie Datta — Portfolio</title>
    <link rel="icon" href="images/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/styles.css">
</head>
<body>

    <!-- Header - populated by scripts/header.js -->
    <header id="main-header"></header>

    <!-- Home / Hero -->
    <section id="home-section">
        <div id="top"></div>
    </section>

    <!-- Resume -->
    <section id="resume" class="container py-4">
        <h2 class="fw-bold text-primary mb-4 text-center"><u>Resume</u></h2>

        <div class="row g-4">
            <div class="col-12"><h4 class="fw-bold text-primary">Objective</h4><div id="objective-container" class="mb-4"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Education</h4><div id="education-container" class="mb-4"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Technical Skills</h4><div id="skills-container" class="mb-4"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Experience</h4><div id="experience-container" class="mb-4"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Projects</h4><div id="projects-container" class="mb-4"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Honors & Awards</h4><div id="honors-container" class="mb-4"></div><div id="volunteer-container"></div></div>
            <div class="col-12"><h4 class="fw-bold text-primary">Contact</h4><div id="contact-container" class="mb-4"></div></div>
        </div>
    </section>

    <footer id="main-footer"></footer>

    <button id="btn-back-to-top" class="btn btn-primary" title="Back to top">↑</button>
    <button id="btn-go-to-bottom" class="btn btn-secondary" title="Go to bottom">↓</button>

    <script src="scripts/header.js"></script>
    <script src="scripts/home.js"></script>
    <script src="scripts/resume.js"></script>
    <script src="scripts/contact.js"></script>
    <script src="scripts/footer.js"></script>
    <script src="scripts/scrollOperations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
